name: sync-from-plugkit

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: sync-from-plugkit
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: AnEntrypoint/rs-plugkit
          path: .rs-plugkit
          fetch-depth: 1

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - uses: oven-sh/setup-bun@v2

      - name: Regenerate the snapshot from the compiled defaults
        run: node scripts/sync-from-plugkit.mjs --rs-plugkit .rs-plugkit

      - name: Open a pull request when the snapshot moved
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.PUBLISHER_TOKEN || github.token }}
          commit-message: 'chore: regenerate snapshot from plugkit compiled defaults'
          title: 'chore: regenerate snapshot from plugkit compiled defaults'
          body: |
            Regenerated by `.github/workflows/sync-from-plugkit.yml` via `scripts/sync-from-plugkit.mjs`.

            The script materializes gm's compiled defaults with the `fsm-vendor` verb and maps them onto
            this repo's declared layout. Every prose key was cross-checked against the `AnEntrypoint/rs-plugkit`
            checkout before anything was written, so this diff reflects a real upstream move rather than a
            published build lagging its own source.

            Review the diff as instruction-prose text, not as code.
          branch: chore/sync-from-plugkit
          delete-branch: true
          add-paths: |
            prose
            gates
            residual
            fsm
            hooks
